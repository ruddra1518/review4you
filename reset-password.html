<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - Review4You</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <main class="auth-page">

        <div class="auth-container">


            <!-- LOGO -->

            <a href="index.html" class="logo">
                <span class="logo-icon">R</span>
                <span>Review<span class="logo-highlight">4</span>You</span>
            </a>


            <!-- CARD -->

            <div class="auth-card">

                <div class="auth-header">

                    <h1>Reset Password</h1>

                    <p>
                        Create a new password for your
                        Review4You account.
                    </p>

                </div>


                <div class="form-group">

                    <label for="resetPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="resetPassword"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                    >

                </div>


                <div class="form-group">

                    <label for="confirmResetPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmResetPassword"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                    >

                </div>


                <button
                    type="button"
                    class="auth-button"
                    id="resetPasswordBtn"
                >
                    Reset Password
                </button>


                <div class="auth-switch">

                    Remember your password?

                    <a href="login.html">
                        Login
                    </a>

                </div>

            </div>


            <a
                href="index.html"
                class="auth-back"
            >
                ← Back to Review4You
            </a>

        </div>

    </main>


    <script type="module">

        import {
            confirmPasswordReset
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        import { auth } from "./firebase-config.js";


        const resetPasswordBtn =
            document.getElementById("resetPasswordBtn");

        const resetPassword =
            document.getElementById("resetPassword");

        const confirmResetPassword =
            document.getElementById("confirmResetPassword");


        // Get Firebase reset code from the email link

        const urlParams = new URLSearchParams(
            window.location.search
        );

        const mode = urlParams.get("mode");
        const oobCode = urlParams.get("oobCode");


        // Check whether this is a valid Firebase reset link

        if (mode !== "resetPassword" || !oobCode) {

            resetPasswordBtn.disabled = true;

            alert(
                "This password reset link is invalid or expired. Please request a new one."
            );
        }


        resetPasswordBtn.addEventListener(
            "click",
            async function () {

                const newPassword =
                    resetPassword.value.trim();

                const confirmPassword =
                    confirmResetPassword.value.trim();


                if (!newPassword || !confirmPassword) {

                    alert("Please fill in both password fields.");
                    return;
                }


                if (newPassword.length < 6) {

                    alert(
                        "Password must be at least 6 characters."
                    );
                    return;
                }


                if (newPassword !== confirmPassword) {

                    alert("Passwords do not match.");
                    return;
                }


                try {

                    await confirmPasswordReset(
                        auth,
                        oobCode,
                        newPassword
                    );


                    alert(
                        "Password reset successful! You can now login with your new password."
                    );


                    window.location.href =
                        "login.html";

                } catch (error) {

                    console.error(error);


                    if (
                        error.code ===
                        "auth/expired-action-code"
                    ) {

                        alert(
                            "This password reset link has expired. Please request a new one."
                        );

                    } else if (
                        error.code ===
                        "auth/invalid-action-code"
                    ) {

                        alert(
                            "This password reset link is invalid or has already been used."
                        );

                    } else if (
                        error.code ===
                        "auth/weak-password"
                    ) {

                        alert(
                            "Password is too weak. Please choose a stronger password."
                        );

                    } else {

                        alert(
                            "Could not reset your password. Please try again."
                        );
                    }

                }

            }
        );

    </script>

</body>

</html>
