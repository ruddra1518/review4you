<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - Review4You</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <!-- BRAND -->

            <a
                href="../index.html"
                class="auth-logo"
            >

                <span class="logo-icon">
                    R
                </span>

                <span>
                    Review<span class="logo-highlight">4</span>You
                </span>

            </a>


            <!-- SIGNUP CARD -->

            <div class="auth-card">

                <div class="auth-header">

                    <h1>
                        Create Account
                    </h1>

                    <p>
                        Join Review4You and share your local experience.
                    </p>

                </div>


                <div class="form-group">

                    <label for="signupName">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                    >

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                    >

                </div>


                <button
                    type="button"
                    id="signupBtn"
                    class="auth-button"
                >
                    Create Account
                </button>


                <p class="auth-switch">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>


            <!-- BACK HOME -->

            <a
                href="../index.html"
                class="auth-back"
            >
                ← Back to Home
            </a>

        </div>

    </main>


    <script type="module" src="../js/auth.js"></script>

</body>

</html>
