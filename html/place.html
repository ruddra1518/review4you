<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Place Details - Review4You</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="container nav-container">

            <a href="../index.html" class="logo">
                <span class="logo-icon">R</span>
                <span>
                    Review<span class="logo-highlight">4</span>You
                </span>
            </a>

            <nav class="nav-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="../index.html#categories">
                    Categories
                </a>

                <a href="../index.html#recommended">
                    Recommendations
                </a>

            </nav>

            <div class="nav-actions">

    <a href="../index.html" class="mobile-home-btn">
        🏠
    </a>

    <button class="location-btn" id="locationButton">
        📍 Your Area
    </button>

    <a
        href="login.html"
        class="login-btn"
        id="accountLink"
    >
        Login
    </a>

</div>
            <!-- LOCATION POPUP -->

<div class="location-popup" id="locationPopup">

    <div class="location-popup-header">

        <h3>
            Choose your location
        </h3>

        <button id="closeLocationPopup">
            ×
        </button>

    </div>

    <button
        class="detect-location-btn"
        id="detectLocationBtn"
    >
        📍 Use My Current Location
    </button>

    <div class="location-divider">
        <span>or</span>
    </div>

    <div class="manual-location">

        <label for="manualLocationInput">
            Enter location manually
        </label>

        <input
            type="text"
            id="manualLocationInput"
            placeholder="e.g. Bhilai, Chhattisgarh"
            autocomplete="off"
        >

        <div
            class="location-suggestions"
            id="locationSuggestions"
        ></div>

        <button id="saveManualLocationBtn">
            Use This Location
        </button>

    </div>

</div>
            <div
                id="accountMenu"
                class="account-menu"
            ></div>

        </div>

    </header>


    <!-- PLACE DETAILS -->

    <main class="container">

        <section
            class="place-details-page"
            id="placeDetails"
        >

            <!-- JavaScript will put the place here -->

        </section>

    </main>


<script src="../js/data.js"></script>
<script src="../js/review.js"></script>
<script type="module" src="../js/place.js"></script>
<script src="../js/location.js"></script>

</body>

</html>
