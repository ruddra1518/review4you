<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Review4You</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <!-- LOGO -->

            <a href="#" class="logo">
                <span class="logo-icon">R</span>
                <span>Review<span class="logo-highlight">4</span>You</span>
            </a>


            <!-- CARD -->

            <div class="auth-card">

                <div class="auth-header">

                    <h1>Forgot Password?</h1>

                    <p>
                        Enter the email address associated with
                        your Review4You account.
                    </p>

                </div>


                <div class="form-group auth-card">

                    <label for="forgotEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >

                </div>


                <button
                    type="button"
                    class="auth-button"
                    id="verifyEmailBtn"
                >
                    Continue
                </button>


                <div class="auth-switch">

                    Remember your password?

                    <a href="login.html">
                        Login
                    </a>

                </div>

            </div>


            <a href="index.html" class="auth-back">
                ← Back to Review4You
            </a>

        </div>

    </main>


    <script type="module" src="auth.js"></script>

</body>

</html>
